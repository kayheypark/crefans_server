# Use with compose.yml, locally built amd64 images, and `up --no-build`.
services:
  database:
    mem_limit: 1g
  api:
    image: ${API_IMAGE:?Set the verified API image tag}
    mem_limit: 512m
  worker:
    image: ${API_IMAGE:?Set the verified API image tag}
    mem_limit: 384m
  frontend:
    image: ${FRONTEND_IMAGE:?Set the verified frontend image tag}
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    mem_limit: 768m
  proxy:
    mem_limit: 128m
