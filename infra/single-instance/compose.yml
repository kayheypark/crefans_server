# Linux single-host backend. Existing front/admin and HTTPS proxy run on this host too.
services:
  database:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: crefans
      MYSQL_USER: crefans
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - member-db:/var/lib/mysql
    command: ["--innodb-buffer-pool-size=268435456", "--max-connections=50"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
  server:
    build:
      context: ../..
      dockerfile: infra/single-instance/Dockerfile
    restart: unless-stopped
    # Linux host network: DB and host Postfix are only reachable on loopback.
    network_mode: host
    env_file:
      - .env.runtime
    environment:
      DATABASE_URL: ${LOCAL_DATABASE_URL:?Set URL with URL-encoded credentials}
      HOST: 127.0.0.1
      PORT: 3001
      NODE_ENV: prod
    depends_on:
      database:
        condition: service_healthy
volumes:
  member-db:
